<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดเฟรนชิปออนไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=Mali:wght@400;700&family=Itim&family=Sriracha&family=Kanit:wght@400;700&family=Charm:wght@400;700&family=Pattaya&display=swap" rel="stylesheet">
<style>
/* VOICE: สนุก อบอุ่น เหมือนสมุดเฟรนชิปสมัยเรียน
   IDEA: สมุดเล่มจริงวางบนโต๊ะ เพื่อนหนึ่งคนต่อหนึ่งหน้า
   PICTURE: หน้าสมุดที่กำลังเปิดอยู่ ใหญ่กลางจอ
   COLOUR/TYPE: โต๊ะสีม่วงอ่อน ชมพูสดเป็นสีเน้น หมึกสีม่วงเข้ม / Mali + IBM Plex Sans Thai
   LAYOUT: รายชื่อหน้าซ้าย เครื่องมือด้านบน สมุดตรงกลาง มือถือเรียงลงมา */
:root{--desk:#efe7ff;--ink:#2b2140;--acc:#ff4f8b;--card:#fff;--line:#ddd2f5;--mut:#6b5f86}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:15px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100vh;height:100dvh}
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px;gap:12px;overflow:auto}
.brand{font:700 24px/1.1 Mali,cursive;color:var(--acc)}
.mode{font-size:12px;color:var(--mut);line-height:1.4}
.mode b{color:var(--ink)}
.mode i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:6px}
.mode.on i{background:#10b981}
#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#list button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;border:1px solid transparent;background:none;font:inherit;color:inherit;cursor:pointer;min-height:46px}
#list button:hover{background:#f6f1ff}
#list button.on{background:#ffe3ed;border-color:#ffb3cc;font-weight:600}
#list .sw{width:26px;height:34px;border-radius:3px 6px 6px 3px;flex:none;border:1px solid rgba(0,0,0,.12);display:grid;place-items:center;font-size:11px;color:var(--mut)}
#list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{display:flex;gap:6px}
input,select,button{font:inherit;font-size:16px}
input[type=text],select{padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-height:42px;background:#fff;color:var(--ink)}
.add input{flex:1;width:100%}
.btn{min-height:42px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#bba8ea}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.warn{color:#c0264f}
.btn.sm{min-height:36px;padding:4px 10px;font-size:15px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffb3cc;outline-offset:2px}
main{display:flex;flex-direction:column;min-height:0}
.tools,.ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px}
.tools{background:var(--card);border-bottom:1px solid var(--line)}
.tools .grow{flex:1}
.ctx{min-height:60px;background:#faf7ff;border-bottom:1px solid var(--line)}
.ctx label,.ctx .lb{font-size:13px;color:var(--mut)}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.c{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbbfe8;cursor:pointer;padding:0;flex:none}
.c.on{box-shadow:0 0 0 3px var(--acc)}
input[type=color]{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
input[type=range]{width:110px;accent-color:var(--acc)}
.stage{flex:1;min-height:0;display:grid;place-items:center;padding:14px;overflow:hidden}
#wrap{position:relative}
#page{position:absolute;left:0;top:0;width:600px;height:800px;transform-origin:0 0;border-radius:4px 14px 14px 4px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 18px 40px -12px rgba(43,33,64,.35);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;--pl:rgba(43,33,64,.13)}
#page.dk{--pl:rgba(255,255,255,.16)}
#page[data-pat=lines]{background-image:repeating-linear-gradient(transparent 0 49px,var(--pl) 49px 50px);background-position:0 20px}
#page[data-pat=dots]{background-image:radial-gradient(var(--pl) 2px,transparent 2.5px);background-size:24px 24px}
#page[data-pat=grid]{background-image:linear-gradient(var(--pl) 1px,transparent 1px),linear-gradient(90deg,var(--pl) 1px,transparent 1px);background-size:26px 26px}
#page::before{content:'';position:absolute;inset:0 auto 0 0;width:24px;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent);pointer-events:none;z-index:900}
#page .loading{position:absolute;inset:0;display:grid;place-items:center;font:20px Mali,cursive;color:var(--mut)}
.el{position:absolute;cursor:move;touch-action:none}
.el.sel{outline:2px dashed var(--acc);outline-offset:5px}
.el .h{display:none;position:absolute;right:-14px;bottom:-14px;width:24px;height:24px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:nwse-resize;z-index:2}
.el.sel .h{display:block}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.35;outline:none;min-height:1.2em}
.txt[contenteditable=true]{cursor:text;user-select:text;-webkit-user-select:text;background:rgba(255,255,255,.7);border-radius:4px;box-shadow:0 0 0 2px #ffb3cc}
.el.img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.el.img.frame{background:#fff;padding:10px 10px 36px;box-shadow:0 6px 14px rgba(0,0,0,.22)}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:800;touch-action:none}
#page.drawing #ink{pointer-events:auto;cursor:crosshair}
#page.drawing .el{pointer-events:none}
.nav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 12px;padding:0 8px 12px;color:var(--mut)}
#status{position:fixed;right:14px;bottom:14px;background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:80vw;z-index:50}
#status.show{opacity:1;transform:none}
#status.bad{background:#c0264f}
.hint{font-size:12px;color:var(--mut);line-height:1.5;margin-top:auto}
@media(max-width:760px){
 .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
 .side{flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:8px}
 .brand,.mode,.hint{display:none}
 #list{flex-direction:row}
 #list button{white-space:nowrap;width:auto}
 .add{flex:none}.add input{width:120px;flex:none}
 .acct{flex-direction:row;align-items:center;flex:none}.acct .who{max-width:110px}
 .tools,.ctx{padding:8px;gap:5px;flex-wrap:nowrap;overflow-x:auto}
 .tools>*,.ctx>*{flex:none}.tools .grow{display:none}
 .btn{padding:6px 9px}
}
body.view .side,body.view .tools,body.view .ctx{display:none}
body.ro [data-tool],body.ro #addText,body.ro #addImg,body.ro #undo,body.ro .tools .sep{display:none}
body.ro .el{cursor:default}body.ro .el .h{display:none}
.acct{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.acct .who{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .row{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:14px;color:var(--ink)}
body.view .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
body.view .el{cursor:default}body.view .el .h{display:none}body.view .el.sel{outline:none}
body.view .stage{padding:18px}
.vonly{display:none}body.view .vonly{display:inline-flex}body.view .eonly{display:none}
body.view.locked #exitView{display:none}
body.view .nav{padding:4px 0 14px}
@media(prefers-reduced-motion:reduce){#status{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">สมุดเฟรนชิป</div>
    <div class="mode" id="mode"><i></i>กำลังเชื่อมต่อ…</div>
    <div class="acct" id="acct"></div>
    <ul id="list"></ul>
    <button class="btn pri" id="myPage" hidden>เขียนหน้าของฉัน</button>
    <form class="add" id="addForm">
      <input type="text" id="newName" placeholder="ชื่อเพื่อน" maxlength="40" aria-label="ชื่อเพื่อน">
      <button class="btn pri" type="submit">+ หน้า</button>
    </form>
    <div class="hint">เพื่อน 1 คน = 1 หน้า ล็อกอินแล้วแก้ได้เฉพาะหน้าของตัวเอง<br>แตะสองครั้งที่ข้อความเพื่อแก้ ลากเพื่อย้าย จุดชมพูมุมขวาล่างใช้ย่อ/ขยาย</div>
  </aside>
  <main>
    <div class="tools" id="tools">
      <button class="btn on" data-tool="select">ย้าย / เลือก</button>
      <button class="btn" data-tool="pen">ปากกา</button>
      <button class="btn" data-tool="eraser">ยางลบ</button>
      <span class="sep"></span>
      <button class="btn" id="addText">+ ข้อความ</button>
      <button class="btn" id="addImg">+ รูปภาพ</button>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <span class="sep"></span>
      <button class="btn" id="undo" title="Ctrl+Z">ย้อนกลับ</button>
      <span class="grow"></span>
      <button class="btn" id="viewBtn">โหมดอ่าน</button>
      <button class="btn" id="share">คัดลอกลิงก์สมุด</button>
    </div>
    <div class="ctx" id="ctx"></div>
    <div class="stage" id="stage">
      <div id="wrap"><div id="page"><div class="loading">กำลังเปิดสมุด…</div><canvas id="ink" width="900" height="1200"></canvas></div></div>
    </div>
    <div class="nav">
      <button class="btn sm" id="prev">‹ ก่อนหน้า</button>
      <span id="pno">–</span>
      <button class="btn sm" id="next">ถัดไป ›</button>
      <button class="btn sm vonly" id="viewLink">คัดลอกลิงก์โหมดอ่าน</button>
      <button class="btn sm vonly pri" id="exitView">แก้ไขสมุด</button>
    </div>
  </main>
</div>
<div id="status" role="status"></div>

<script type="module">
/* ===== ใส่ค่า Firebase ของคุณตรงนี้ (Project settings > Your apps > SDK setup and configuration) =====
   ถ้าเว้นว่างไว้ สมุดจะบันทึกไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น */
const firebaseConfig = {
  apiKey: "AIzaSyCwUuYMdPdgRLtEbmEaetdYLo4cM6_m8ok",
  authDomain: "aunfriendship.firebaseapp.com",
  projectId: "aunfriendship",
  storageBucket: "aunfriendship.firebasestorage.app",
  messagingSenderId: "232354709597",
  appId: "1:232354709597:web:5fe9880de4315184228db4",
  measurementId: "G-DZD22HJF09"
};
/* ======================================================================================== */

const W=600,H=800,CW=900,CH=1200;
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const bookId=((new URLSearchParams(location.search).get('book'))||'my-friendship-book').replace(/[^\w-]/g,'').slice(0,60)||'book';

const FONTS=[['Mali','มาลี (ลายมือ)'],['Sriracha','ศรีราชา (ลายมือ)'],['Itim','อิทิม'],['Pattaya','พัทยา'],['Charm','ชาม (ตัวเขียน)'],['Kanit','คณิต'],['IBM Plex Sans Thai','ตัวปกติ']];
const BG=['#ffffff','#fff4c2','#ffd6e0','#d8f3e6','#d6ecff','#e9ddff','#ffe0c7','#2b2140'];
const PAGE_BG=['#fff4c2','#d8f3e6','#d6ecff','#e9ddff','#ffe0c7','#ffd6e0'];
const PATS=[['none','เรียบ'],['lines','เส้นบรรทัด'],['dots','จุด'],['grid','ตาราง']];
const INK=['#2b2140','#ff4f8b','#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#ffffff'];

const qs=new URLSearchParams(location.search);
let viewMode=false, user=null, book, bookFromCache=true;
let store, pages={}, cur='cover', tool='select', sel=null, editingId=null, busy=false, scale=1, loaded=false;
let penColor='#2b2140', penSize=6, renderedJson='', inkFor=null, inkTimer=null;
const dirty={}, timers={}, hist={}, aCache={};
const pg=$('#page'), ink=$('#ink'), ictx=ink.getContext('2d');

/* ---------- สถานะ ---------- */
let stT;
function status(msg,bad){const s=$('#status');s.textContent=msg;s.classList.toggle('bad',!!bad);s.classList.add('show');clearTimeout(stT);stT=setTimeout(()=>s.classList.remove('show'),bad?5000:1600)}

/* ---------- ที่เก็บข้อมูล: Firebase หรือในเครื่อง ---------- */
async function makeStore(){
  if(firebaseConfig.apiKey&&firebaseConfig.projectId){
    try{
      const base='https://www.gstatic.com/firebasejs/10.12.2/';
      const {initializeApp}=await import(base+'firebase-app.js');
      const F=await import(base+'firebase-firestore.js');
      const A=await import(base+'firebase-auth.js');
      const app=initializeApp(firebaseConfig);
      const auth=A.getAuth(app);
      let db;
      try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}
      catch(e){db=F.getFirestore(app)}
      const col=F.collection(db,'books',bookId,'pages');
      const aDoc=id=>F.doc(db,'books',bookId,'assets',id),bDoc=F.doc(db,'books',bookId);
      return {
        mode:'firebase',
        onAuth(cb){A.onAuthStateChanged(auth,cb)},
        async login(){const pr=new A.GoogleAuthProvider();
          try{await A.signInWithPopup(auth,pr)}catch(e){
            if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')return A.signInWithRedirect(auth,pr);
            if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')throw e}},
        logout:()=>A.signOut(auth),
        listenBook(cb){F.onSnapshot(bDoc,s=>cb(s.exists()?s.data():null,s.metadata.fromCache),err=>status('อ่านข้อมูลสมุดไม่ได้: '+(err.code||err.message),true))},
        claim:u=>F.setDoc(bDoc,{owner:u.uid,ownerName:u.displayName||'',created:Date.now()}),
        listen(cb){F.onSnapshot(col,{includeMetadataChanges:false},snap=>{const m={};snap.forEach(d=>{m[d.id]=d.data()});cb(m,snap.metadata.fromCache)},
          err=>status('เชื่อม Firebase ไม่สำเร็จ: '+(err.code||err.message)+' (ตรวจ Rules ของ Firestore)',true))},
        save:p=>F.setDoc(F.doc(col,p.id),p),
        remove:id=>F.deleteDoc(F.doc(col,id)),
        putAsset:(id,data)=>F.setDoc(aDoc(id),{data,uid:user?user.uid:'',t:Date.now()}),
        getAsset:async id=>{const s=await F.getDoc(aDoc(id));return s.exists()?s.data().data:null},
        delAsset:id=>F.deleteDoc(aDoc(id)).catch(()=>{})
      };
    }catch(e){console.error(e);status('โหลด Firebase ไม่ได้ ใช้การบันทึกในเครื่องแทน',true)}
  }
  const K='fb:'+bookId+':';
  const ls={
    get(k){try{return JSON.parse(localStorage.getItem(K+k))}catch(e){return null}},
    set(k,v){try{localStorage.setItem(K+k,JSON.stringify(v));return true}catch(e){status('พื้นที่ในเครื่องเต็ม: เชื่อม Firebase เพื่อเก็บรูปได้มากขึ้น',true);return false}},
    del(k){try{localStorage.removeItem(K+k)}catch(e){}}
  };
  return {
    mode:'local',
    onAuth(cb){cb(null)},listenBook(cb){cb({owner:'local'},false)},
    listen(cb){cb(ls.get('pages')||{},false)},
    async save(p){const m=ls.get('pages')||{};m[p.id]=p;if(!ls.set('pages',m))throw new Error('ที่เก็บเต็ม')},
    async remove(id){const m=ls.get('pages')||{};delete m[id];ls.set('pages',m)},
    async putAsset(id,data){if(!ls.set('a:'+id,data))throw new Error('ที่เก็บเต็ม')},
    async getAsset(id){return ls.get('a:'+id)},
    async delAsset(id){ls.del('a:'+id)}
  };
}
const loadAsset=id=>id?(aCache[id]||(aCache[id]=store.getAsset(id).catch(()=>null))):Promise.resolve(null);
const touch=id=>{dirty[id]=Date.now()};
function queueSave(id){
  touch(id);clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{const p=pages[id];if(!p)return;touch(id);
    store.save(JSON.parse(JSON.stringify(p))).then(()=>status('บันทึกแล้ว')).catch(e=>status('บันทึกไม่สำเร็จ: '+(e.code||e.message),true))},500);
}

/* ---------- หน้าเริ่มต้น ---------- */
const T=(x,y,w,text,size,o={})=>({id:uid(),type:'text',x,y,w,text,size,color:'#2b2140',font:'Mali',bold:false,align:'left',rot:0,...o});
function defaultCover(){return {id:'cover',order:0,name:'หน้าปก',bg:'#ffd6e0',pattern:'dots',drawing:null,elements:[
  T(50,250,500,'สมุดเฟรนชิป',80,{font:'Pattaya',align:'center'}),
  T(70,380,460,'ของ ……………',36,{color:'#ff4f8b',bold:true,align:'center'}),
  T(80,640,440,'แตะสองครั้งที่ตัวอักษรเพื่อแก้ไข\nลากเพื่อย้าย ใส่รูปปกได้ที่ “+ รูปภาพ”',18,{align:'center',color:'#6b5f86'})]}}
function friendPage(id,name,order){
  const els=[T(40,34,520,'หน้าของ '+name,46,{font:'Pattaya',align:'center',color:'#ff4f8b'})];
  ['ชื่อจริง:','ชื่อเล่น:','วันเกิด:','สีที่ชอบ:','อาหารที่ชอบ:','งานอดิเรก:','ความฝัน:'].forEach((t,i)=>els.push(T(44,130+i*50,310,t,22)));
  els.push(T(380,190,180,'แปะรูปตัวเอง\nตรงนี้นะ',20,{align:'center',color:'#9a8fb3'}));
  els.push(T(44,520,512,'ข้อความถึงเจ้าของสมุด:\n',22,{bold:true}));
  els.push(T(44,736,512,'ลงชื่อ ……………   วันที่ ……………',18));
  return {id,order,name,bg:PAGE_BG[order%PAGE_BG.length],pattern:'lines',drawing:null,elements:els};
}

/* ---------- สิทธิ์ ---------- */
function isOwner(){return store&&store.mode==='local'||!!(user&&book&&book.owner===user.uid)}
function canEdit(p){return !!p&&(store.mode==='local'||!!user&&(isOwner()||p.uid===user.uid))}
function locked(){return viewMode||!canEdit(pages[cur])}
const myId=()=>user?'u_'+user.uid:null;
function applyPerm(){
  const ro=!canEdit(pages[cur]);document.body.classList.toggle('ro',ro);
  if(ro&&tool!=='select'){tool='select';pg.classList.remove('drawing');document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool==='select'))}
  if(ro)finishEdit();
  $('#addForm').hidden=!isOwner();
  const mp=$('#myPage');mp.hidden=!(store.mode==='firebase'&&user&&!isOwner());
  mp.textContent=user&&pages[myId()]?'ไปหน้าของฉัน':'เขียนหน้าของฉัน';
  renderAcct();
}
function renderAcct(){
  const a=$('#acct');a.textContent='';if(store.mode!=='firebase')return;
  const btn=(t,f,cls='btn sm')=>{const b=document.createElement('button');b.className=cls;b.textContent=t;b.onclick=f;return b};
  if(!user){const n=document.createElement('div');n.textContent='ล็อกอินเพื่อเขียนหน้าของคุณ';a.append(n,btn('ล็อกอินด้วย Google',login,'btn pri sm'));return}
  const w=document.createElement('div');w.className='who';w.textContent=(user.displayName||user.email||'ผู้ใช้')+(isOwner()?' · เจ้าของสมุด':'');

async function compress(file){
  const src=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
  const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
  const iw=im.naturalWidth||600,ih=im.naturalHeight||600,alpha=/png|gif|webp|svg/.test(file.type);
  let url='';
  for(const [max,q] of [[1400,.85],[1100,.8],[850,.75],[650,.7],[480,.6]]){
    const s=Math.min(1,max/Math.max(iw,ih)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(iw*s));c.height=Math.max(1,Math.round(ih*s));
    const x=c.getContext('2d');if(!alpha){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);
    url=alpha?c.toDataURL('image/webp',q):c.toDataURL('image/jpeg',q);
    if(alpha&&!url.startsWith('data:image/webp'))url=c.toDataURL('image/png');
    if(url.length<700000)break;
  }
  return {url,w:iw,h:ih};
}
async function addImages(files,at){
  if(locked())return;setTool('select');const pid=cur;
  for(const [k,f] of [...files].entries()){
    if(!f.type.startsWith('image/'))continue;
    status('กำลังอัปโหลดรูป…');
    try{
      const {url,w,h}=await compress(f),id='img_'+uid();
      await store.putAsset(id,url);aCache[id]=Promise.resolve(url);
      const bw=Math.min(280,w),bh=Math.round(bw*h/w),p=pages[pid];if(!p)return;
      const x=at?at.x-bw/2:W/2-bw/2+k*24,y=at?at.y-bh/2:H/2-bh/2+k*24;
      const it={id:uid(),type:'img',x:Math.round(clamp(x,0,W-60)),y:Math.round(clamp(y,0,H-60)),w:bw,h:bh,asset:id,rot:0,frame:false};
      if(pid===cur){mut(()=>{p.elements.push(it)});sel=it.id;renderPage()}else{p.elements.push(it);queueSave(pid)}
      status('ใส่รูปแล้ว');
    }catch(e){console.error(e);status('ใส่รูปไม่สำเร็จ: '+(e.code||e.message),true)}
  }
}

  ictx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
  ictx.strokeStyle=ictx.fillStyle=penColor;ictx.lineWidth=(tool==='eraser'?penSize*3:penSize)*1.5;ictx.lineCap=ictx.lineJoin='round';
  ictx.beginPath();ictx.arc(last.x,last.y,ictx.lineWidth/2,0,Math.PI*2);ictx.fill();
});
ink.addEventListener('pointermove',e=>{
  if(!busy||tool==='select'||!last)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(const ev of (evs.length?evs:[e])){const p=pt(ev),m={x:(last.x+p.x)/2,y:(last.y+p.y)/2};
    ictx.beginPath();ictx.moveTo(mid.x,mid.y);ictx.quadraticCurveTo(last.x,last.y,m.x,m.y);ictx.stroke();last=p;mid=m}
});
const inkUp=()=>{if(!last)return;busy=false;last=null;clearTimeout(inkTimer);const pid=cur;inkTimer=setTimeout(()=>saveInk(pid),800)};
ink.addEventListener('pointerup',inkUp);ink.addEventListener('pointercancel',inkUp);
function flushInk(){if(inkTimer){clearTimeout(inkTimer);inkTimer=null;saveInk(cur)}}
async function saveInk(pid){
  inkTimer=null;const p=pages[pid];if(!p||pid!==cur)return;
  let url=ink.toDataURL('image/png');
  if(url.length>900000){const w=ink.toDataURL('image/webp',.8);if(w.startsWith('data:image/webp'))url=w}
  if(url.length>1000000)return status('ลายมือในหน้านี้เยอะเกินไป ลองลบบางส่วน',true);
  const id='ink_'+uid(),old=p.drawing;touch(pid);
  try{await store.putAsset(id,url);aCache[id]=Promise.resolve(url);p.drawing=id;if(pid===cur){inkFor=pid+'|'+id;renderedJson=JSON.stringify(p)}queueSave(pid);if(old)store.delAsset(old)}
  catch(e){status('บันทึกลายมือไม่สำเร็จ: '+(e.code||e.message),true)}
}

/* ---------- เปลี่ยนหน้า เพิ่มหน้า ---------- */
function goto(id,dir=0){if(!pages[id])return;finishEdit();flushInk();sel=null;cur=id;renderSide();renderPage();
  if(viewMode&&dir&&pg.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)
    pg.animate([{opacity:0,transform:`scale(${scale}) translateX(${dir*40}px)`},{opacity:1,transform:`scale(${scale})`}],{duration:260,easing:'ease-out'})}
let swipeX=null;
pg.addEventListener('pointerup',e=>{if(!locked()||swipeX==null)return;const dx=e.clientX-swipeX;swipeX=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});
function setView(on){
  finishEdit();flushInk();setTool('select');select(null);viewMode=on;document.body.classList.toggle('view',on);
  const u=new URL(location.href);if(on)u.searchParams.set('view','1');else u.searchParams.delete('view');u.searchParams.set('book',bookId);
  try{history.replaceState(null,'',u)}catch(e){}
  fit();
}
$('#viewBtn').onclick=()=>setView(true);
$('#exitView').onclick=()=>setView(false);
$('#viewLink').onclick=async()=>{const u=location.origin+location.pathname+'?book='+bookId+'&view=1';
  try{await navigator.clipboard.writeText(u);status('คัดลอกลิงก์โหมดอ่านแล้ว')}catch(e){status(u)}};
function step(d){const o=ordered(),i=o.findIndex(p=>p.id===cur);if(o[i+d])goto(o[i+d].id,d)}
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#addForm').onsubmit=e=>{
  e.preventDefault();if(!loaded||!isOwner())return;
  const name=$('#newName').value.trim()||'เพื่อน',order=Math.max(0,...Object.values(pages).map(p=>p.order||0))+1,id='p_'+uid();
  pages[id]=friendPage(id,name,order);if(user)pages[id].uid=user.uid;queueSave(id);$('#newName').value='';goto(id);status('เพิ่มหน้าของ '+name+' แล้ว');
};
$('#undo').onclick=undo;
$('#myPage').onclick=()=>{
  if(!user)return login();const id=myId();if(pages[id])return goto(id);
  const name=(user.displayName||'เพื่อน').split(' ')[0],order=Math.max(0,...Object.values(pages).map(p=>p.order||0))+1;
  pages[id]=friendPage(id,name,order);pages[id].uid=user.uid;queueSave(id);goto(id);status('สร้างหน้าของคุณแล้ว เขียนได้เลย');
};
$('#share').onclick=async()=>{const u=location.origin+location.pathname+'?book='+bookId;
  try{await navigator.clipboard.writeText(u);status('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย')}catch(e){status(u)}};

document.addEventListener('keydown',e=>{
  if(editingId){if(e.key==='Escape')finishEdit();return}
  if(e.target.closest('input,select,textarea'))return;
  if(locked()){if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight'||(viewMode&&e.key===' '))step(1);if(viewMode&&e.key==='Escape'&&!document.body.classList.contains('locked'))setView(false);return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return}
  const it=sel&&find(sel);
  if(it&&(e.key==='Delete'||e.key==='Backspace')){e.preventDefault();delSel();return}
  if(it&&e.key==='Enter'&&it.type==='text'){e.preventDefault();startEdit(it.id);return}
  const d=e.shiftKey?10:1,mv={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[e.key];
  if(mv&&it){e.preventDefault();mut(()=>{it.x+=mv[0];it.y+=mv[1]});return}
  if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);
  if(e.key==='Escape')select(null);
});

/* ---------- ปรับขนาดให้พอดีจอ ---------- */
const stage=$('#stage'),wrap=$('#wrap');
const fit=()=>{scale=Math.max(.2,Math.min((stage.clientWidth-28)/W,(stage.clientHeight-28)/H));wrap.style.width=W*scale+'px';wrap.style.height=H*scale+'px';pg.style.transform=`scale(${scale})`};
const ro=new ResizeObserver(fit);ro.observe(stage);fit();

/* ---------- เริ่ม ---------- */
if(qs.get('view')){document.body.classList.add('locked');setView(true)}
store=await makeStore();
const md=$('#mode');
if(store.mode==='firebase'){md.classList.add('on');md.innerHTML='<i></i>ออนไลน์ บันทึกขึ้น Firebase<br>สมุด: <b></b>'}
else md.innerHTML='<i></i>บันทึกในเครื่องนี้เท่านั้น<br>ใส่ค่า Firebase ในไฟล์เพื่อเก็บออนไลน์<br>สมุด: <b></b>';
md.querySelector('b').textContent=bookId;
store.onAuth(u=>{user=u;sel=null;permChanged()});
store.listenBook((b,fc)=>{book=b;bookFromCache=fc;permChanged()});
store.listen(onRemote);
updCtx();
</script>
</body>
</html>
